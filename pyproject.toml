[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vaisseaux"
version = "0.1.0"
description = "Tracé des vaisseaux sanguins rétiniens (DRIVE) par plus court chemin sur le graphe des pixels"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pillow>=10",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
figures = ["matplotlib>=3.8"]
ml = ["torch>=2.5"]  # U-Net et étude des métriques (python -m vaisseaux.unet / vaisseaux.etude)
demo = ["gradio>=5", "huggingface_hub>=0.23"]  # démo Gradio et déploiement du Space
dev = ["vaisseaux[api,figures]", "pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["E501"]  # la longueur de ligne est gérée par ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
